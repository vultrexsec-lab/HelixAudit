<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HelixAudit – Authorized Security Scanner</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #3b82f6;
      --accent2: #8b5cf6;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 2rem 1.25rem; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;
    }
    .logo { font-size: 1.75rem; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .badge { background: #1e3a5f; color: #93c5fd; font-size: 0.75rem; padding: 0.25rem 0.6rem; border-radius: 999px; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem;
    }
    h2 { font-size: 1.15rem; margin-bottom: 1rem; color: #f1f5f9; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.35rem; }
    input, select, textarea {
      width: 100%; padding: 0.7rem 0.9rem; border-radius: 8px;
      border: 1px solid var(--border); background: #0f172a; color: var(--text);
      font-size: 0.95rem; margin-bottom: 1rem;
    }
    input:focus, select:focus { outline: none; border-color: var(--accent); }
    .btn {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px;
      font-weight: 600; cursor: pointer; font-size: 0.95rem;
      transition: opacity 0.2s, transform 0.15s;
    }
    .btn:hover { opacity: 0.92; transform: translateY(-1px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-secondary { background: #334155; }
    .row { display: flex; gap: 1rem; flex-wrap: wrap; }
    .row > * { flex: 1; min-width: 200px; }
    .status { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.9rem; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .dot.running { background: var(--warning); animation: pulse 1s infinite; }
    .dot.completed { background: var(--success); }
    .dot.failed { background: var(--danger); }
    @keyframes pulse { 50% { opacity: 0.4; } }
    .progress-bar {
      height: 8px; background: #0f172a; border-radius: 4px; overflow: hidden; margin: 0.75rem 0;
    }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 0.4s; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 0.65rem 0.75rem; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; }
    .sev { font-size: 0.75rem; padding: 0.15rem 0.5rem; border-radius: 4px; font-weight: 600; text-transform: uppercase; }
    .sev-critical { background: #7f1d1d; color: #fecaca; }
    .sev-high { background: #9a3412; color: #fed7aa; }
    .sev-medium { background: #854d0e; color: #fde68a; }
    .sev-low { background: #1e3a5f; color: #bfdbfe; }
    .sev-info { background: #1e293b; color: #94a3b8; }
    .warning-box {
      background: #422006; border: 1px solid #b45309; color: #fde68a;
      padding: 0.9rem 1rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1.5rem;
    }
    .empty { color: var(--muted); text-align: center; padding: 2rem; }
    #results { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <div class="logo">HelixAudit</div>
        <div style="color:var(--muted);font-size:0.85rem;margin-top:0.2rem">Authorized Security Scanner</div>
      </div>
      <span class="badge">Phase 5 • Reporting</span>
    </header>

    <div class="warning-box">
      ⚠️ <strong>Authorized use only.</strong> Only scan targets you own or have explicit written permission to test. Unauthorized scanning is illegal.
    </div>

    <div class="card">
      <h2>New Scan</h2>
      <div class="row">
        <div>
          <label>Target URL or Domain</label>
          <input id="target" type="text" placeholder="example.com or https://example.com" />
        </div>
        <div>
          <label>Project Name (optional)</label>
          <input id="projectName" type="text" placeholder="My Client Project" value="Quick Scan" />
        </div>
      </div>
      <button class="btn" id="startBtn" onclick="startScan()">Start Discovery + Deep Analysis</button>
    </div>

    <div class="card" id="statusCard" style="display:none">
      <h2>Scan Status</h2>
      <div class="status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">—</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div style="font-size:0.85rem;color:var(--muted)" id="scanMeta"></div>
      <div style="margin-top:1rem" id="reportBtnWrap" style="display:none">
        <a id="reportLink" href="#" target="_blank" class="btn btn-secondary" style="text-decoration:none;display:inline-block">View HTML Report</a>
      </div>
    </div>

    <div id="results">
      <div class="card">
        <h2>Findings</h2>
        <div id="findingsTable"><div class="empty">No findings yet</div></div>
      </div>
      <div class="card">
        <h2>Discovered Assets</h2>
        <div id="assetsTable"><div class="empty">No assets yet</div></div>
      </div>
    </div>
  </div>

  <script>
    // ========== CONFIG ==========
    // Change this to your Render backend URL if different
    const API_BASE = "https://helixaudit.onrender.com/api/v1";

    let currentScanId = null;
    let pollTimer = null;

    async function startScan() {
      const target = document.getElementById("target").value.trim();
      const projectName = document.getElementById("projectName").value.trim() || "Quick Scan";
      if (!target) { alert("Please enter a target"); return; }

      const btn = document.getElementById("startBtn");
      btn.disabled = true;
      btn.textContent = "Starting...";

      try {
        // 1. Create project
        const projRes = await fetch(`${API_BASE}/projects`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: projectName, description: "Created from HelixAudit UI", scope: target })
        });
        const project = await projRes.json();

        // 2. Start scan
        const scanRes = await fetch(`${API_BASE}/scans`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ project_id: project.id, target: target, scan_type: "discovery" })
        });
        const scan = await scanRes.json();
        currentScanId = scan.id;

        document.getElementById("statusCard").style.display = "block";
        document.getElementById("results").style.display = "none";
        updateStatus(scan);

        // Poll
        pollTimer = setInterval(pollScan, 3000);
      } catch (err) {
        alert("Error starting scan: " + err.message);
        btn.disabled = false;
        btn.textContent = "Start Discovery + Deep Analysis";
      }
    }

    async function pollScan() {
      if (!currentScanId) return;
      try {
        const res = await fetch(`${API_BASE}/scans/${currentScanId}`);
        const scan = await res.json();
        updateStatus(scan);

        if (scan.status === "completed" || scan.status === "failed") {
          clearInterval(pollTimer);
          document.getElementById("startBtn").disabled = false;
          document.getElementById("startBtn").textContent = "Start Discovery + Deep Analysis";
          if (scan.status === "completed") {
            loadResults();
            const wrap = document.getElementById("reportBtnWrap");
            const link = document.getElementById("reportLink");
            if (wrap && link) {
              wrap.style.display = "block";
              link.href = API_BASE + "/scans/" + currentScanId + "/report";
            }
          }
        }
      } catch (e) {
        console.error(e);
      }
    }

    function updateStatus(scan) {
      const dot = document.getElementById("statusDot");
      const text = document.getElementById("statusText");
      const fill = document.getElementById("progressFill");
      const meta = document.getElementById("scanMeta");

      dot.className = "dot " + (scan.status || "");
      text.textContent = `${scan.status?.toUpperCase() || "—"}  •  Progress: ${scan.progress || 0}%`;
      fill.style.width = (scan.progress || 0) + "%";
      meta.textContent = `Scan #${scan.id}  |  Target: ${scan.target}`;
    }

    async function loadResults() {
      document.getElementById("results").style.display = "block";

      // Findings
      const fRes = await fetch(`${API_BASE}/scans/${currentScanId}/findings`);
      const findings = await fRes.json();
      const fContainer = document.getElementById("findingsTable");
      if (!findings.length) {
        fContainer.innerHTML = '<div class="empty">No findings recorded</div>';
      } else {
        let html = `<table><thead><tr><th>Severity</th><th>Title</th><th>Category</th><th>Location</th></tr></thead><tbody>`;
        for (const f of findings) {
          html += `<tr>
            <td><span class="sev sev-${f.severity}">${f.severity}</span></td>
            <td>${escapeHtml(f.title)}</td>
            <td>${escapeHtml(f.category || "—")}</td>
            <td style="max-width:220px;overflow:hidden;text-overflow:ellipsis">${escapeHtml(f.location || "—")}</td>
          </tr>`;
        }
        html += `</tbody></table>`;
        fContainer.innerHTML = html;
      }

      // Assets
      const aRes = await fetch(`${API_BASE}/scans/${currentScanId}/assets`);
      const assets = await aRes.json();
      const aContainer = document.getElementById("assetsTable");
      if (!assets.length) {
        aContainer.innerHTML = '<div class="empty">No assets discovered</div>';
      } else {
        let html = `<table><thead><tr><th>Type</th><th>Value</th></tr></thead><tbody>`;
        for (const a of assets.slice(0, 50)) {
          html += `<tr><td>${escapeHtml(a.asset_type)}</td><td>${escapeHtml(a.value)}</td></tr>`;
        }
        html += `</tbody></table>`;
        if (assets.length > 50) html += `<div style="color:var(--muted);font-size:0.85rem;margin-top:0.5rem">Showing 50 of ${assets.length} assets</div>`;
        aContainer.innerHTML = html;
      }
    }

    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
  </script>
</body>
</html>
