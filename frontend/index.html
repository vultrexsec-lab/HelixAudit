<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HelixAudit – Authorized Security Scanner</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --accent: #3b82f6; --accent2: #8b5cf6;
      --text: #e2e8f0; --muted: #94a3b8; --success: #22c55e; --warning: #f59e0b;
      --danger: #ef4444; --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; }
    .container { max-width: 1100px; margin: 0 auto; padding: 2rem 1.25rem; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
    .logo { font-size: 1.75rem; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .badge { background: #1e3a5f; color: #93c5fd; font-size: 0.75rem; padding: 0.25rem 0.6rem; border-radius: 999px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
    h2 { font-size: 1.15rem; margin-bottom: 1rem; color: #f1f5f9; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.35rem; }
    input, select { width: 100%; padding: 0.7rem 0.9rem; border-radius: 8px; border: 1px solid var(--border); background: #0f172a; color: var(--text); font-size: 0.95rem; margin-bottom: 1rem; }
    input:focus, select:focus { outline: none; border-color: var(--accent); }
    .btn { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.95rem; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.92; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: #334155; }
    .btn-sm { padding: 0.35rem 0.7rem; font-size: 0.8rem; }
    .row { display: flex; gap: 1rem; flex-wrap: wrap; }
    .row > * { flex: 1; min-width: 180px; }
    .status { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.9rem; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .dot.running { background: var(--warning); animation: pulse 1s infinite; }
    .dot.completed { background: var(--success); }
    .dot.failed { background: var(--danger); }
    @keyframes pulse { 50% { opacity: 0.4; } }
    .progress-bar { height: 8px; background: #0f172a; border-radius: 4px; overflow: hidden; margin: 0.75rem 0; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 0.4s; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 0.65rem 0.75rem; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; }
    .sev { font-size: 0.72rem; padding: 0.15rem 0.45rem; border-radius: 4px; font-weight: 600; text-transform: uppercase; white-space: nowrap; }
    .sev-critical { background: #7f1d1d; color: #fecaca; }
    .sev-high { background: #9a3412; color: #fed7aa; }
    .sev-medium { background: #854d0e; color: #fde68a; }
    .sev-low { background: #1e3a5f; color: #bfdbfe; }
    .sev-info { background: #1e293b; color: #94a3b8; }
    .warning-box { background: #422006; border: 1px solid #b45309; color: #fde68a; padding: 0.9rem 1rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1.5rem; }
    .empty { color: var(--muted); text-align: center; padding: 2rem; }
    .evidence { font-size: 0.8rem; color: var(--muted); max-width: 280px; word-break: break-all; }
    .actions { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    #results { display: none; }
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .tab { padding: 0.4rem 0.9rem; border-radius: 6px; background: #0f172a; border: 1px solid var(--border); color: var(--muted); cursor: pointer; font-size: 0.85rem; }
    .tab.active { background: var(--accent); color: white; border-color: var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <div class="logo">HelixAudit</div>
        <div style="color:var(--muted);font-size:0.85rem;margin-top:0.2rem">Authorized Security Scanner</div>
      </div>
      <span class="badge">Phase 8 • Export Ready</span>
    </header>

    <div class="warning-box">
      ⚠️ <strong>Authorized use only.</strong> Only scan targets you own or have explicit written permission to test. Unauthorized scanning is illegal.
    </div>

    <div class="card">
      <h2>New Scan</h2>
      <div class="row">
        <div>
          <label>Target URL or Domain</label>
          <input id="target" type="text" placeholder="https://example.com" />
        </div>
        <div>
          <label>Project Name (optional)</label>
          <input id="projectName" type="text" placeholder="My Client Project" value="Quick Scan" />
        </div>
        <div>
          <label>API Key (optional)</label>
          <input id="apiKey" type="password" placeholder="If backend requires X-API-Key" />
        </div>
      </div>
      <button class="btn" id="startBtn" onclick="startScan()">Start Discovery + Deep Analysis</button>
    </div>

    <div class="card" id="statusCard" style="display:none">
      <h2>Scan Status</h2>
      <div class="status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">—</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div style="font-size:0.85rem;color:var(--muted)" id="scanMeta"></div>
      <div style="margin-top:1rem;display:none;gap:0.5rem;flex-wrap:wrap" id="reportBtnWrap">
        <a id="reportLink" href="#" target="_blank" class="btn btn-secondary btn-sm" style="text-decoration:none">HTML Report (Print/PDF)</a>
        <a id="jsonLink" href="#" target="_blank" class="btn btn-secondary btn-sm" style="text-decoration:none">JSON Export</a>
      </div>
    </div>

    <div id="results">
      <div class="card">
        <div class="tabs">
          <div class="tab active" onclick="showTab('findings', this)">Findings</div>
          <div class="tab" onclick="showTab('assets', this)">Assets</div>
        </div>
        <div id="findingsPanel">
          <div id="findingsTable"><div class="empty">No findings yet</div></div>
        </div>
        <div id="assetsPanel" style="display:none">
          <div id="assetsTable"><div class="empty">No assets yet</div></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "https://helixaudit.onrender.com/api/v1";
    let currentScanId = null;
    let pollTimer = null;
    let allFindings = [];

    function headers() {
      const h = { "Content-Type": "application/json" };
      const key = document.getElementById("apiKey").value.trim();
      if (key) h["X-API-Key"] = key;
      return h;
    }

    async function startScan() {
      const target = document.getElementById("target").value.trim();
      const projectName = document.getElementById("projectName").value.trim() || "Quick Scan";
      if (!target) { alert("Please enter a target"); return; }

      const btn = document.getElementById("startBtn");
      btn.disabled = true;
      btn.textContent = "Starting...";

      try {
        const projRes = await fetch(`${API_BASE}/projects`, {
          method: "POST", headers: headers(),
          body: JSON.stringify({ name: projectName, description: "Created from HelixAudit UI", scope: target })
        });
        if (!projRes.ok) throw new Error(await projRes.text());
        const project = await projRes.json();

        const scanRes = await fetch(`${API_BASE}/scans`, {
          method: "POST", headers: headers(),
          body: JSON.stringify({ project_id: project.id, target, scan_type: "discovery" })
        });
        if (!scanRes.ok) throw new Error(await scanRes.text());
        const scan = await scanRes.json();
        currentScanId = scan.id;

        document.getElementById("statusCard").style.display = "block";
        document.getElementById("results").style.display = "none";
        document.getElementById("reportBtnWrap").style.display = "none";
        updateStatus(scan);
        pollTimer = setInterval(pollScan, 3000);
      } catch (err) {
        alert("Error: " + err.message);
        btn.disabled = false;
        btn.textContent = "Start Discovery + Deep Analysis";
      }
    }

    async function pollScan() {
      if (!currentScanId) return;
      try {
        const res = await fetch(`${API_BASE}/scans/${currentScanId}`, { headers: headers() });
        const scan = await res.json();
        updateStatus(scan);
        if (scan.status === "completed" || scan.status === "failed") {
          clearInterval(pollTimer);
          document.getElementById("startBtn").disabled = false;
          document.getElementById("startBtn").textContent = "Start Discovery + Deep Analysis";
          if (scan.status === "completed") {
            loadResults();
            const wrap = document.getElementById("reportBtnWrap");
            const link = document.getElementById("reportLink");
            wrap.style.display = "block";
            link.href = `${API_BASE}/scans/${currentScanId}/report`;
            const jsonLink = document.getElementById("jsonLink");
            if (jsonLink) jsonLink.href = `${API_BASE}/scans/${currentScanId}/export`;
          }
        }
      } catch (e) { console.error(e); }
    }

    function updateStatus(scan) {
      document.getElementById("statusDot").className = "dot " + (scan.status || "");
      document.getElementById("statusText").textContent = `${(scan.status || "—").toUpperCase()}  •  Progress: ${scan.progress || 0}%`;
      document.getElementById("progressFill").style.width = (scan.progress || 0) + "%";
      document.getElementById("scanMeta").textContent = `Scan #${scan.id}  |  Target: ${scan.target}`;
    }

    async function loadResults() {
      document.getElementById("results").style.display = "block";

      const fRes = await fetch(`${API_BASE}/scans/${currentScanId}/findings`, { headers: headers() });
      allFindings = await fRes.json();
      renderFindings();

      const aRes = await fetch(`${API_BASE}/scans/${currentScanId}/assets`, { headers: headers() });
      const assets = await aRes.json();
      const aContainer = document.getElementById("assetsTable");
      if (!assets.length) {
        aContainer.innerHTML = '<div class="empty">No assets discovered</div>';
      } else {
        let html = `<table><thead><tr><th>Type</th><th>Value</th></tr></thead><tbody>`;
        for (const a of assets.slice(0, 80)) {
          html += `<tr><td>${esc(a.asset_type)}</td><td>${esc(a.value)}</td></tr>`;
        }
        html += `</tbody></table>`;
        if (assets.length > 80) html += `<div style="color:var(--muted);font-size:0.85rem;margin-top:0.5rem">Showing 80 of ${assets.length}</div>`;
        aContainer.innerHTML = html;
      }
    }

    function renderFindings() {
      const fContainer = document.getElementById("findingsTable");
      if (!allFindings.length) {
        fContainer.innerHTML = '<div class="empty">No findings recorded</div>';
        return;
      }
      let html = `<table><thead><tr>
        <th>Severity</th><th>Title / Evidence</th><th>Category</th><th>Status</th><th>Action</th>
      </tr></thead><tbody>`;
      for (const f of allFindings) {
        html += `<tr>
          <td><span class="sev sev-${f.severity}">${f.severity}</span></td>
          <td>
            <strong>${esc(f.title)}</strong>
            ${f.location ? `<div class="evidence">${esc(f.location)}</div>` : ""}
            ${f.evidence ? `<div class="evidence">${esc(String(f.evidence).slice(0, 160))}</div>` : ""}
            ${f.remediation ? `<div class="evidence"><em>Fix: ${esc(String(f.remediation).slice(0, 120))}</em></div>` : ""}
          </td>
          <td>${esc(f.category || "—")}</td>
          <td>${esc(f.status || "new")}</td>
          <td class="actions">
            <select onchange="updateStatus(${f.id}, this.value)" style="margin:0;padding:0.3rem;font-size:0.8rem">
              <option value="">Change...</option>
              <option value="confirmed">Confirmed</option>
              <option value="false_positive">False Positive</option>
              <option value="fixed">Fixed</option>
              <option value="retest">Retest</option>
              <option value="new">New</option>
            </select>
          </td>
        </tr>`;
      }
      html += `</tbody></table>`;
      fContainer.innerHTML = html;
    }

    async function updateStatus(findingId, status) {
      if (!status) return;
      try {
        const res = await fetch(`${API_BASE}/findings/${findingId}`, {
          method: "PATCH",
          headers: headers(),
          body: JSON.stringify({ status })
        });
        if (!res.ok) throw new Error(await res.text());
        const updated = await res.json();
        const idx = allFindings.findIndex(f => f.id === findingId);
        if (idx >= 0) allFindings[idx] = updated;
        renderFindings();
      } catch (e) {
        alert("Failed to update status: " + e.message);
      }
    }

    function showTab(name, el) {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      el.classList.add("active");
      document.getElementById("findingsPanel").style.display = name === "findings" ? "block" : "none";
      document.getElementById("assetsPanel").style.display = name === "assets" ? "block" : "none";
    }

    function esc(str) {
      if (!str) return "";
      return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
  </script>
</body>
</html>
